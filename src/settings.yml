---
strategy: static
no_screen_padding: 'no'
dark_mode: 'no'
static_data: "{}"
polling_verb: get
framework_version: latest
serverless_language:
polling_url: ''
polling_headers: ''
polling_body:
id: 476393
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: answer_mode
  field_type: select
  name: Answer display
  description: How the trivia and riddle answers are shown
  help_text: Upside down lets you peek when you want. "Reveal at a set time" hides the answer until the time below.
  options:
  - Upside down: upside_down
  - Reveal at a set time: reveal_at_time
  - Show plainly: shown
  - Never show: hidden
  default: upside_down
- keyname: reveal_time
  field_type: time
  name: Reveal time
  description: Only used when Answer display is "Reveal at a set time"
  help_text: Uses your account time zone. Your device needs to refresh after this time to pick up the answer, so a device that only wakes once a day may never show it.
  default: '18:00'
  optional: true
name: Facts, Trivia & Riddles
description: A fact, a question and a riddle
refresh_interval: 15
